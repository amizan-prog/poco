<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carian PO & CO</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 sm:p-5 bg-[var(--color-bg)]" style="font-family: var(--font-body);">

  <main class="w-full max-w-3xl bg-[var(--color-surface)] p-6 sm:p-8 rounded-[var(--radius)] shadow-lg">
    <h1 class="text-2xl sm:text-3xl font-bold text-center text-[var(--color-text)]" style="font-family: var(--font-heading);">
      Carian PO & CO
    </h1>
    <p class="text-center text-sm sm:text-base text-[var(--color-muted)] mt-2 mb-6 leading-relaxed">
      Masukkan nombor penuh PO/CO atau 6 digit terakhir<br class="hidden sm:block" />
      <span class="text-[var(--color-primary)] font-medium">Contoh: CO26-013631 atau 013631</span>
    </p>

    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
      <div class="relative flex-1">
        <label for="searchInput" class="sr-only">Nombor PO/CO</label>
        <input type="text" id="searchInput" placeholder="Masukkan Nombor PO/CO..." autocomplete="off" class="w-full px-4 py-3.5 border border-gray-300 rounded-[var(--radius)] text-base focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent transition" aria-describedby="searchHint">
      </div>
      <button id="searchBtn" type="button" onclick="searchData()" class="w-full sm:w-auto px-6 py-3.5 bg-[var(--color-primary)] text-[var(--color-primary-contrast)] rounded-[var(--radius)] text-base font-semibold transition hover:bg-[var(--color-primary-hover)] disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span id="btnText">Cari Rekod</span>
        <svg id="btnSpinner" class="hidden w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
      <button type="button" onclick="clearSearch()" class="w-full sm:w-auto px-5 py-3.5 border-2 border-[var(--color-primary)] text-[var(--color-primary)] rounded-[var(--radius)] text-base font-semibold transition hover:bg-[var(--color-primary)] hover:text-[var(--color-primary-contrast)]">
        Kosongkan
      </button>
    </div>

    <div id="statusMsg" class="mt-5 text-center font-medium hidden" role="status" aria-live="polite"></div>

    <div id="resultHeader" class="hidden mt-6 mb-3 flex items-center justify-between">
      <h2 class="text-lg font-bold text-[var(--color-text)]">Keputusan Carian</h2>
      <span id="resultCount" class="text-sm font-semibold px-3 py-1 rounded-full bg-[var(--color-success-bg)] text-[var(--color-success-border)]"></span>
    </div>

    <div id="result" class="hidden mt-4 space-y-4" aria-live="polite"></div>
  </main>

  <script>
    // Your published Google Sheet URL
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS9evtZbukaOs4EjMPhz75ufzjM_rIWQTpvcKUwh8IqpSvrOyrd3Dr63GanpPaSgA/pubhtml';

    // Extract the Sheet ID from the published URL
    const urlMatch = sheetUrl.match(/\/d\/e\/([a-zA-Z0-9_-]+)\/pubhtml/);
    const sheetId = urlMatch ? urlMatch[1] : '';

    function getCsvUrl(gid) {
      return `https://docs.google.com/spreadsheets/d/e/${sheetId}/pub?output=csv&gid=${gid}`;
    }

    // Discover every sheet/tab gid from the published HTML page
    async function getSheetGids() {
      const response = await fetch(sheetUrl);
      const html = await response.text();
      const gids = new Set();
      let match;

      const gidRegex = /gid=(\d+)/g;
      while ((match = gidRegex.exec(html)) !== null) {
        gids.add(match[1]);
      }

      const hashRegex = /#\/gid\/(\d+)/g;
      while ((match = hashRegex.exec(html)) !== null) {
        gids.add(match[1]);
      }

      // Always include the first sheet
      gids.add('0');

      return Array.from(gids);
    }

    // Fetch all rows from every sheet/tab
    async function fetchAllRows() {
      const gids = await getSheetGids();
      const allRows = [];

      for (const gid of gids) {
        try {
          const response = await fetch(getCsvUrl(gid));
          const csvText = await response.text();
          const rows = parseCsv(csvText);
          // Skip the header row of each sheet
          for (let i = 1; i < rows.length; i++) {
            allRows.push(rows[i]);
          }
        } catch (error) {
          console.error(`Ralat membaca tab ${gid}:`, error);
        }
      }

      return allRows;
    }

    function setLoading(isLoading) {
      const searchBtn = document.getElementById('searchBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const searchInput = document.getElementById('searchInput');

      searchBtn.disabled = isLoading;
      searchInput.disabled = isLoading;

      if (isLoading) {
        btnText.textContent = 'Sedang mencari...';
        btnSpinner.classList.remove('hidden');
      } else {
        btnText.textContent = 'Cari Rekod';
        btnSpinner.classList.add('hidden');
      }
    }

    function clearSearch() {
      const searchInput = document.getElementById('searchInput');
      const statusMsg = document.getElementById('statusMsg');
      const resultDiv = document.getElementById('result');
      const resultHeader = document.getElementById('resultHeader');

      searchInput.value = '';
      searchInput.focus();
      resultDiv.innerHTML = '';
      resultDiv.classList.add('hidden');
      resultHeader.classList.add('hidden');
      statusMsg.classList.add('hidden');
      setLoading(false);
    }

    function searchData() {
      const rawQuery = document.getElementById('searchInput').value;
      const query = rawQuery.trim().toUpperCase();
      const statusMsg = document.getElementById('statusMsg');
      const resultDiv = document.getElementById('result');
      const resultHeader = document.getElementById('resultHeader');
      const resultCount = document.getElementById('resultCount');

      resultDiv.innerHTML = '';
      resultDiv.classList.add('hidden');
      resultHeader.classList.add('hidden');

      if (query === '') {
        statusMsg.className = 'mt-5 text-center font-medium text-[var(--color-error)]';
        statusMsg.innerHTML = 'Sila masukkan nombor PO/CO yang sah.';
        statusMsg.classList.remove('hidden');
        return;
      }

      statusMsg.className = 'mt-5 text-center font-medium text-[var(--color-primary)]';
      statusMsg.innerHTML = 'Sedang mencari di semua tab...';
      statusMsg.classList.remove('hidden');
      setLoading(true);

      // Prepare last-6-digit comparison only if query is long enough
      const queryLast6 = query.length >= 6 ? query.slice(-6) : '';

      fetchAllRows()
        .then(rows => {
          const matches = [];

          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];

            // Column F is index 5
            if (!row || !row[5]) continue;

            const poNumber = String(row[5]).trim().toUpperCase();
            const poLast6 = poNumber.length >= 6 ? poNumber.slice(-6) : '';

            // Match full PO/CO number OR last 6 digits
            const fullMatch = poNumber === query;
            const partialMatch = queryLast6 && poLast6 === queryLast6;

            if (fullMatch || partialMatch) {
              // Column G is index 6, Column H is index 7, Column K is index 10
              const syarikat = row[6] || '-';
              const jabatan = row[7] || '-';
              const nama = row[10] || '-';

              matches.push({
                poNumber,
                syarikat,
                jabatan,
                nama
              });
            }
          }

          setLoading(false);

          if (matches.length > 0) {
            resultDiv.classList.remove('hidden');
            resultHeader.classList.remove('hidden');
            statusMsg.classList.add('hidden');

            resultCount.textContent = `${matches.length} rekod dijumpai`;

            matches.forEach(match => {
              const card = document.createElement('div');
              card.className = 'p-5 sm:p-6 rounded-[var(--radius)] border-l-[6px] bg-[var(--color-success-bg)] border-[var(--color-success-border)] shadow-sm';
              card.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-[140px_1fr] gap-y-2 sm:gap-y-3 gap-x-4">
                  <p class="text-sm sm:text-base font-semibold text-[var(--color-muted)]">PO/CO</p>
                  <p class="text-base sm:text-lg font-bold text-[var(--color-text)] break-all">${match.poNumber}</p>

                  <p class="text-sm sm:text-base font-semibold text-[var(--color-muted)]">Syarikat</p>
                  <p class="text-base sm:text-lg text-[var(--color-text)] break-words">${match.syarikat}</p>

                  <p class="text-sm sm:text-base font-semibold text-[var(--color-muted)]">Jabatan</p>
                  <p class="text-base sm:text-lg text-[var(--color-text)] break-words">${match.jabatan}</p>

                  <p class="text-sm sm:text-base font-semibold text-[var(--color-muted)]">Nama Pemohon</p>
                  <p class="text-base sm:text-lg text-[var(--color-text)] break-words">${match.nama}</p>
                </div>
              `;
              resultDiv.appendChild(card);
            });
          } else {
            statusMsg.className = 'mt-5 text-center font-medium text-[var(--color-muted)]';
            statusMsg.innerHTML = 'Tiada rekod dijumpai untuk nombor tersebut.';
          }
        })
        .catch(error => {
          setLoading(false);
          statusMsg.className = 'mt-5 text-center font-medium text-[var(--color-error)]';
          statusMsg.innerHTML = 'Ralat. Sila pastikan Google Sheet telah di \'Publish to web\'.';
          console.error(error);
        });
    }

    // Allow pressing Enter to search
    document.getElementById('searchInput').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        searchData();
      }
    });

    // Parse CSV text into a 2D array
    function parseCsv(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (insideQuotes) {
          if (char === '"' && nextChar === '"') {
            currentCell += '"';
            i++;
          } else if (char === '"') {
            insideQuotes = false;
          } else {
            currentCell += char;
          }
        } else {
          if (char === '"') {
            insideQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentCell);
            currentCell = '';
          } else if (char === '\n' || char === '\r') {
            if (char === '\r' && nextChar === '\n') {
              i++;
            }
            currentRow.push(currentCell);
            rows.push(currentRow);
            currentRow = [];
            currentCell = '';
          } else {
            currentCell += char;
          }
        }
      }

      currentRow.push(currentCell);
      rows.push(currentRow);
      return rows;
    }

  </script>

</body>

</html>
